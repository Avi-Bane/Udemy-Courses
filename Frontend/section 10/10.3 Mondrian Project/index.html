<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mondrian Project</title>
  <style>
    /* 
    Write your CSS here 
    Gap Colour: #000
    White: #F0F1EC
    Red: #E72F24
    Black: #232629
    Blue: #004592
    Yellow: #F9D01E

    For dimensions, see dimensions.png image.
    HINT: Remember you can't change the properties of grid lines.
    But grid lines are transparent!
    */

    body{
      display: flex;
      justify-content: center;
      align-items: center;
      padding-top: 2rem;
      height: 100vh;
    }
    .container{
      background-color: #000;
      height:748px;
      width: 748px;
      display: grid;
      grid-template-columns: 320px 198px 153px 50px ;
      grid-template-rows: 414px 130px 155px 20px ;
      gap:5px;
    }
    
    .white1{
      background-color:#F0F1EC ;
      grid-column-start: 2;
      grid-column-end: 6;
    }
    .redBox{
      background-color: #E72F24;
      grid-column-start: 1 ;
      grid-column-end: 2;
    }
    .white2{
      background-color:#F0F1EC ;
      grid-column-start: span 1;
      grid-row-start: 2;
      grid-row-end: 4;
    }
    .white3{
      background-color:#F0F1EC ;
      grid-column-start: span 2;
      grid-row-start: 2;
      grid-row-end: 4;
    }
    .white4{
      background-color:#F0F1EC ;
      grid-column-start: span 2;
      grid-row-start: 3;
      grid-row-end: 6;
    }
    .white5{
      background-color:#F0F1EC ;
      grid-column-start: span 1;
      grid-row-start: 4;
      grid-row-end: 6;
    }
    .blue{
      background-color:#004592 ;
      grid-column-start: 4;
      grid-column-end: 6;
      grid-row-start: 2;
      grid-row-end: 3;
      margin-bottom: 10px;
    }

    .yellow{
      background-color: #F9D01E;
      grid-column-start: span 1;
      grid-row-start: 4;
      grid-row-end: 6;
    }
    .black{
       background-color: #232629;
      grid-column-start: span 1;
      grid-row-start: 4;
      grid-row-end: 6;
    }
  </style>
</head>

<body>
    <div class="container">
        <div class="redBox"></div>
        <div class="white1"></div>
        <div class="white2"></div>
        <div class="white3"></div>
        <div class="white4"></div>
        <div class="white5"></div>
        <div class="blue"></div>
        <div class="yellow"></div>
        <div class="black"></div>
    </div>
</body>

</html>
